[package]
name = "proofcash-crypto"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
description = "Cryptographic primitives for ProofCash: Poseidon2, Blake3, BabyJubjub, and WebAuthn P-256 verifiers"

[dependencies]
blake3 = "1.5"
zeroize = { version = "1.7", features = ["derive"] }
subtle = "2.5"
p256 = { version = "0.13", features = ["ecdsa", "pkcs8"] }
sha2 = "0.10"
