[workspace]
resolver = "2"
members = [
    "crates/proofcash-crypto",
    "crates/proofcash-core",
    "crates/proofcash-engine",
    "crates/proofcash-circuits",
    "crates/proofcash-storage",
    "crates/proofcash-node",
    "crates/proofcash-prover",
]

[workspace.package]
version = "0.1.0"
authors = ["Ren Ishida <ren.ishida@protonmail.ch>"]
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/proofcash/proofcash"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
overflow-checks = true
