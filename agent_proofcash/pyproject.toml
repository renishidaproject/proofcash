[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-proofcash"
version = "0.1.0"
authors = [
  { name = "Ren Ishida", email = "ren.ishida@protonmail.ch" }
]
description = "Autonomous Machine-to-Machine Micro-Streaming SDK for ProofCash Protocol"
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = []
